schema = 1
project = "cmbx"

# Preserved hosted Linux gates live here; no pre-existing .ci/ccid.toml existed,
# so every hosted Linux check below is the preserved contract (resolve/cargo-update
# excluded per prior-cohort rule; registry/live reads stay FRESH outside cache).
[checks.verify]
kind = "commands"
fleet = true
commands = [
  ["ccid", "first-party"],
  ["cargo", "fmt", "--all", "--check"],
  ["cargo", "clippy", "--locked", "--all-targets", "--", "-D", "warnings"],
  ["cargo", "test", "--locked"],
  ["python3", ".ci/test-clock-regression.py"],
  ["cargo", "check", "--locked", "--target", "wasm32-unknown-unknown"],
  ["ccid", "coverage", "run"],
]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["python3", "--version"], ["rustup", "run", "nightly", "rustc", "-vV"], ["rustup", "run", "nightly", "cargo", "llvm-cov", "--version"]]
cache_outputs = ["coverage.json", "coverage.lcov", "coverage.txt"]

[render]
render_schema = 2

[jobs.verify]
scheduler = "forgejo"
runs_on = "linux"
checks = ["verify"]
workflow = "ci"
command = ["bash", ".ci/run-cached.sh"]

[check_shell]

[coverage]

[security]
dependencies = "cargo-deny"
